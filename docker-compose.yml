# P10.1 — three-node FakeMarket + Prometheus + Grafana (no Kubernetes)
services:
  node-a:
    build: .
    image: fakemarket:local
    container_name: fake-market-node-a
    environment:
      FAKEMARKET_ENV: production
      FAKEMARKET_NODE_ID: node-a
      FAKEMARKET_HTTP_PORT: "8080"
      FAKEMARKET_DATA_DIR: /data
      FAKEMARKET_WAL_DIR: /data/wal
      FAKEMARKET_CONSENSUS_DIR: /data/consensus
    ports:
      - "8081:8080"
    volumes:
      - node-a-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  node-b:
    image: fakemarket:local
    container_name: fake-market-node-b
    depends_on:
      node-a:
        condition: service_started
    environment:
      FAKEMARKET_ENV: production
      FAKEMARKET_NODE_ID: node-b
      FAKEMARKET_HTTP_PORT: "8080"
      FAKEMARKET_DATA_DIR: /data
      FAKEMARKET_WAL_DIR: /data/wal
      FAKEMARKET_CONSENSUS_DIR: /data/consensus
    ports:
      - "8082:8080"
    volumes:
      - node-b-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  node-c:
    image: fakemarket:local
    container_name: fake-market-node-c
    depends_on:
      node-a:
        condition: service_started
    environment:
      FAKEMARKET_ENV: production
      FAKEMARKET_NODE_ID: node-c
      FAKEMARKET_HTTP_PORT: "8080"
      FAKEMARKET_DATA_DIR: /data
      FAKEMARKET_WAL_DIR: /data/wal
      FAKEMARKET_CONSENSUS_DIR: /data/consensus
    ports:
      - "8083:8080"
    volumes:
      - node-c-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  # P10.3 — deterministic demo workload on real gRPC path (bufconn in-process).
  # Exposes exchange /metrics on :9100 for Prometheus/Grafana; does not replace nodes.
  sim:
    image: fakemarket:local
    container_name: fake-market-sim
    depends_on:
      node-a:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      FAKEMARKET_ENV: production
    entrypoint: ["/app/fakemarket-sim"]
    command:
      - -seed=42
      - -scenario=normal
      - -duration=2m
      - -rate=50
      - -clients=4
      - -instruments=8
      - -accounts=50
      - -metrics-addr=:9100
      - -wal=/data/sim-wal
    ports:
      - "9100:9100"
    volumes:
      - sim-data:/data
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fake-market-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-a
      - node-b
      - node-c
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fake-market-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/exchange-overview.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
  sim-data:
  prometheus-data:
  grafana-data:
