global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fakemarket
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-a:8080
          - node-b:8080
          - node-c:8080
        labels:
          cluster: local
  # P10.3: simulator embeds the real exchange stack and exposes its metrics registry.
  - job_name: fakemarket-sim
    metrics_path: /metrics
    scrape_interval: 2s
    static_configs:
      - targets:
          - sim:9100
        labels:
          cluster: local
          role: simulator
