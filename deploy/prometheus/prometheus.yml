global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fakemarket
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-a:8080
          - node-b:8080
          - node-c:8080
        labels:
          cluster: local
