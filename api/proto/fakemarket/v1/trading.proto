syntax = "proto3";

package fakemarket.v1;

option go_package = "github.com/ghrushneshr25/fakemarket/api/gen/fakemarket/v1;fakemarketv1";

// TradingService is the gRPC adapter surface for command path only.
// Queries belong to P6.2. Market data belongs to P6.3+.
service TradingService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_ACCEPTED = 1;
  ORDER_STATUS_RESTING = 2;
  ORDER_STATUS_PARTIALLY_FILLED = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELLED = 5;
  ORDER_STATUS_EXPIRED = 6;
  ORDER_STATUS_REJECTED = 7;
}

message SubmitOrderRequest {
  string account_id = 1;
  string instrument_id = 2;
  Side side = 3;
  OrderType order_type = 4;
  // price_ticks is domain Price (integer ticks). Required for LIMIT; must be unset/0 for MARKET.
  int64 price_ticks = 5;
  int64 quantity = 6;
  TimeInForce time_in_force = 7;
  // Client-generated key for command-level idempotency (also via metadata x-idempotency-key).
  string idempotency_key = 8;
}

message SubmitOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
  uint64 order_sequence = 3;
  int64 remaining_quantity = 4;
  string request_id = 5;
}

message CancelOrderRequest {
  string account_id = 1;
  string order_id = 2;
  string idempotency_key = 3;
}

message CancelOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
  int64 remaining_quantity = 3;
  string request_id = 4;
}
