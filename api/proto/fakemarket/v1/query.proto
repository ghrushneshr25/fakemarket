syntax = "proto3";

package fakemarket.v1;

option go_package = "github.com/ghrushneshr25/fakemarket/api/gen/fakemarket/v1;fakemarketv1";

import "fakemarket/v1/trading.proto";

// QueryService is the read-only gRPC surface (P6.2).
// No mutations. WAL remains SoT.
// as_of_sequence is an EventSeq observation watermark, not a multi-domain
// snapshot version (see ADR 0037).
service QueryService {
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetPosition(GetPositionRequest) returns (GetPositionResponse);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
}

message GetAccountRequest {
  string account_id = 1;
}

message PositionMsg {
  string instrument_id = 1;
  int64 quantity = 2;
  int64 average_price_ticks = 3;
}

message GetAccountResponse {
  string account_id = 1;
  string currency = 2;
  int64 cash = 3;
  int64 reserved_cash = 4;
  int64 available_cash = 5;
  repeated PositionMsg positions = 6;
  int32 open_order_count = 7;
  uint64 as_of_sequence = 8;
}

message GetOrderRequest {
  string account_id = 1;
  string order_id = 2;
}

message OrderMsg {
  string order_id = 1;
  string account_id = 2;
  string instrument_id = 3;
  Side side = 4;
  OrderType order_type = 5;
  TimeInForce time_in_force = 6;
  int64 price_ticks = 7; // 0 if market / unset
  bool has_price = 8;
  int64 original_quantity = 9;
  int64 remaining_quantity = 10;
  int64 filled_quantity = 11;
  OrderStatus status = 12;
  uint64 sequence = 13;
  uint64 as_of_sequence = 14;
}

message GetOrderResponse {
  OrderMsg order = 1;
}

message ListOrdersRequest {
  string account_id = 1;
  string instrument_id = 2; // optional
  OrderStatus status = 3;   // UNSPECIFIED = all
  int32 page_size = 4;
  string page_token = 5;
}

message ListOrdersResponse {
  repeated OrderMsg orders = 1;
  string next_page_token = 2;
  uint64 as_of_sequence = 3;
}

message GetPositionRequest {
  string account_id = 1;
  string instrument_id = 2;
}

message GetPositionResponse {
  PositionMsg position = 1;
  uint64 as_of_sequence = 2;
}

message ListPositionsRequest {
  string account_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPositionsResponse {
  repeated PositionMsg positions = 1;
  string next_page_token = 2;
  uint64 as_of_sequence = 3;
}

message ListTradesRequest {
  string account_id = 1;
  string instrument_id = 2; // optional
  int32 page_size = 3;
  string page_token = 4;
}

message TradeMsg {
  string trade_id = 1;
  string order_id = 2;
  string account_id = 3;
  string instrument_id = 4;
  Side side = 5;
  int64 price_ticks = 6;
  int64 quantity = 7;
  uint64 sequence = 8;
  uint64 as_of_sequence = 9;
}

message ListTradesResponse {
  repeated TradeMsg trades = 1;
  string next_page_token = 2;
  uint64 as_of_sequence = 3;
}

message ListReservationsRequest {
  string account_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ReservationMsg {
  string order_id = 1;
  string account_id = 2;
  string instrument_id = 3;
  int64 reserved_cash = 4;
  int64 reserved_quantity = 5;
  uint64 as_of_sequence = 6;
}

message ListReservationsResponse {
  repeated ReservationMsg reservations = 1;
  string next_page_token = 2;
  uint64 as_of_sequence = 3;
}
